# Render Blueprint: deploys the garden page and the classifier backend together.
# In Render: New > Blueprint, pick this repo, then enter REPLICATE_API_TOKEN and
# SUPABASE_SERVICE_ROLE_KEY when prompted (on an existing service, add them under Environment).
services:
  # Flask classifier backend (calls Replicate's CLIP model).
  - type: web
    name: garden-classifier-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://danas-garden.onrender.com
      - key: SUPABASE_URL
        value: https://njafcckswgcxtvtqrjcn.supabase.co
      # Server-only key that saves accepted flowers; never put it in config.js.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Static garden page (index.html, app.js, styles.css, ...). No build step.
  - type: web
    name: danas-garden
    runtime: static
    buildCommand: ""
    staticPublishPath: .
