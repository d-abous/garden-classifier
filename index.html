<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garden Classifier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <!-- Shared "ink" filter: wobbles every icon stroke so it reads as hand-drawn. -->
      <svg class="svg-defs" aria-hidden="true" focusable="false">
        <filter id="hand-drawn" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="2" seed="4" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- A much gentler version for small, detailed icons: a slow wobble rather than rough ink. -->
        <filter id="hand-drawn-light" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.2" numOctaves="2" seed="7" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </svg>

      <main>
        <section class="hero" id="garden">
          <div class="stage-header">
            <h1 id="garden-stage-title">Welcome to the Garden, I'm glad you're here</h1>
          </div>

          <div class="experience-layout">
            <section class="garden-stage" aria-labelledby="garden-stage-title">

              <div
                class="garden-stage-panel"
                id="garden-stage-panel"
                data-stage-panel="nice"
                data-stage="nice"
              >
                  <div class="garden-island" aria-hidden="true">
                    <img class="island-img" src="./garden-mound-final.png" alt="" draggable="false" />
                    <div class="planted-flowers" data-planted-flowers aria-hidden="true"></div>
                  </div>
              </div>
            </section>

            <aside class="control-panel" aria-labelledby="draw-panel-title">
              <div class="panel-header">
                <h2 id="draw-panel-title">Add flowers to the garden</h2>
              </div>

              <div class="panel-body">
                <div class="palette" aria-label="Flower colors">
                  <button class="swatch green" type="button" aria-label="Green" data-color="#4d8c43" aria-pressed="false"></button>
                  <button class="swatch yellow" type="button" aria-label="Yellow" data-color="#ffd35a" aria-pressed="false"></button>
                  <button class="swatch red is-active" type="button" aria-label="Coral" data-color="#f27f6a" aria-pressed="true"></button>
                  <button class="swatch pink" type="button" aria-label="Deep red" data-color="#b62b36" aria-pressed="false"></button>
                  <button class="swatch orange" type="button" aria-label="Rose pink" data-color="#d85a86" aria-pressed="false"></button>
                </div>

                <div class="canvas-card">
                  <canvas
                    class="drawing-canvas"
                    width="560"
                    height="500"
                    aria-label="Drawing canvas for planting flower sketches"
                  ></canvas>
                  <button class="reset-button" type="button" aria-label="Reset canvas" data-reset-canvas>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <!-- Clockwise arc around (12, 12), kept well inside the box so nothing is cropped -->
                      <path d="M20 12a8 8 0 1 1-8-8c2.24 0 4.38.89 5.99 2.44L20 8.5"/>
                      <!-- Arrowhead where the arc ends, at the upper right -->
                      <path d="M20 3.5v5h-5"/>
                    </svg>
                  </button>
                  <span class="canvas-status" aria-live="polite" style="display:none"></span>
                </div>
              </div>

              <div class="panel-actions">
                <button class="pill-button pill-button--plant" type="button" data-plant-flower>
                  <svg class="nav-icon sprout-icon" viewBox="0 0 32 32" aria-hidden="true">
                    <!-- Hand-drawn sprout; on hover the two leaves grow and open outwards. -->
                    <path d="M6.5 27.6c1.9-2.6 5-3.7 8.2-3.4 2.4-1.2 5.6-.9 7.6.4 1.6.6 2.6 1.6 3.2 3Z" />
                    <path d="M15.9 26.4c-.3-5.4.2-10 2.2-13.6" />
                    <g class="sprout-leaf sprout-leaf--left">
                      <path d="M15.8 19C13.6 13.4 8.6 10.6 3.4 11.6c1.2 5.4 6.6 9.2 12.4 7.4Z" />
                      <path class="sprout-vein" d="M14.8 18.2 7.6 13.6" />
                    </g>
                    <g class="sprout-leaf sprout-leaf--right">
                      <path d="M17.6 13.4C17.4 7 21.8 2.8 28.6 2.4c.4 6.8-4.4 11.6-11 11Z" />
                      <path class="sprout-vein" d="M18.6 12.4 26.6 4.4" />
                    </g>
                  </svg>
                  Plant
                </button>
                <button class="pill-button" type="button" data-open-gallery>
                  See flower gallery
                </button>
              </div>
            </aside>
          </div>
        </section>

      </main>
    </div>

    <dialog class="gallery-modal" id="gallery-modal" aria-labelledby="gallery-title">
      <div class="gallery-header">
        <div>
          <h2 id="gallery-title">Flower gallery</h2>
          <p class="gallery-stats" data-gallery-stats></p>
        </div>
        <button class="nav-pill nav-pill--back is-visible" type="button" data-close-gallery aria-label="Close gallery">
          <span class="back-arrow" aria-hidden="true">
            <!-- A curly hand-drawn arrow; on hover app.js unwinds it into a long line out to the left. -->
            <svg class="nav-icon back-arrow__svg" viewBox="0 0 220 32">
              <path class="back-arrow__line" data-back-line d="M218.6 20.6 C215.2 23.1 210.1 23.1 208.4 19.7 C206.7 16.3 210.1 14.2 212.7 16.3 C214.8 18.5 211.8 21.9 207.6 20.6 C203.3 19.3 201.6 13.8 197.4 9.5" />
              <path class="back-arrow__head" data-back-head d="M10 -6 0 0 10 6" transform="translate(197.4 9.5) rotate(45.7) scale(0.5)" />
            </svg>
          </span>
          <span class="nav-pill__label">Back</span>
        </button>
      </div>

      <div class="gallery-grid" data-gallery-grid></div>
    </dialog>

    <script src="./config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="./classifier.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
